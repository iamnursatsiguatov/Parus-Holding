<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PARUS HOLDING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: навигация по модулям слева, рабочая область справа. Фирменный тёмно-синий PARUS HOLDING как акцент, логотип — белый на синей плашке. */
:root{
  --bg:#EFF0EC; --surface:#FFFFFF; --sunk:#E4E6E1; --ink:#1C2225; --muted:#5B6569; --line:#D5D8D2;
  --accent:#1F4E8C; --accent-ink:#1A4176; --on-accent:#FFFFFF; --brand:#13294B; --logo-filter:brightness(0) opacity(.9); --series:#6F96BC; --series2:#B9CCDE; --series-soft:rgba(111,150,188,.16);
  --ok:#2C7A4B; --ok-bg:#DDEFE3; --warn:#B4531A; --warn-bg:#F7E3D3; --crit:#B3261E; --crit-bg:#F6DAD7; --info:#2F5E8C; --info-bg:#DCE7F2;
  --map-bg:#E6E3DA; --map-bench:#CFC9BA; --map-line:#A79F8B;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131719; --surface:#1B2124; --sunk:#232A2E; --ink:#E5E8E3; --muted:#98A3A6; --line:#2E373B;
  --accent:#7DAEE8; --accent-ink:#A3C6EF; --on-accent:#0B1626; --brand:#13294B; --logo-filter:none; --series:#5F87AE; --series2:#34506D; --series-soft:rgba(95,135,174,.18);
  --ok:#62C68F; --ok-bg:#1D3427; --warn:#F09055; --warn-bg:#3A2619; --crit:#F2786F; --crit-bg:#3D1F1D; --info:#7FB0E0; --info-bg:#1C2B3B;
  --map-bg:#22282A; --map-bench:#2F3739; --map-line:#4A5457; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131719; --surface:#1B2124; --sunk:#232A2E; --ink:#E5E8E3; --muted:#98A3A6; --line:#2E373B;
  --accent:#7DAEE8; --accent-ink:#A3C6EF; --on-accent:#0B1626; --brand:#13294B; --logo-filter:none; --series:#5F87AE; --series2:#34506D; --series-soft:rgba(95,135,174,.18);
  --ok:#62C68F; --ok-bg:#1D3427; --warn:#F09055; --warn-bg:#3A2619; --crit:#F2786F; --crit-bg:#3D1F1D; --info:#7FB0E0; --info-bg:#1C2B3B;
  --map-bg:#22282A; --map-bench:#2F3739; --map-line:#4A5457; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1360px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h2,h3,h4{text-wrap:balance}

header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .plate{flex:none;display:flex;align-items:center}
.brand .plate img{display:block;height:40px;width:auto;max-width:100%;filter:var(--logo-filter)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){.brand{flex-wrap:wrap}.brand .plate img{height:32px}}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand small{display:block;color:var(--muted);font-size:12px}
.top .sp{flex:1}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock b{color:var(--ink);font-weight:600}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--sunk);border:1px dashed var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner b{color:var(--accent-ink)}
.tag-ex{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:2px 6px}

.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
nav.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}
.side .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.side select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600}
.mods{display:flex;flex-direction:column;gap:1px}
.mod{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.mod:hover{background:var(--sunk);color:var(--ink)}
.mod.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.mod .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mod.on .no{color:var(--accent-ink)}
.mod .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.badge.crit{background:var(--crit);color:#fff}.badge.warn{background:var(--warn-bg);color:var(--warn)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static}
  .mods{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .mod{grid-template-columns:auto auto auto;white-space:nowrap;flex:none}
  .mod .t{overflow:visible}
}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.head{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.head h2{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.015em;margin:0}
.head .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.head .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
.head .grow{flex:1;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select,td select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.sub-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.sub-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.sub-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.kpi .d{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi svg{width:100%;height:28px;margin-top:2px}

.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.na{background:var(--sunk);color:var(--muted)}.pill.info{background:var(--info-bg);color:var(--info)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;min-width:0;margin-bottom:16px}
.grid2 .panel,.grid3 .panel{margin-bottom:0}
.panel>h3{font-size:14px;font-weight:600;margin:0 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel>h3 .sp{flex:1}
.panel .cap{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:13px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--series)} .chart .bar2{fill:var(--series2)}
.chart .plan{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.chart .ln{fill:none;stroke:var(--series);stroke-width:2}
.chart .area{fill:var(--series-soft)}
.chart .pt{fill:var(--series)}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lim{stroke:var(--crit);stroke-dasharray:4 4;stroke-width:1.5}
.chart text.limt{fill:var(--crit)}
.chart .lbl{fill:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.panel .tbl-wrap{border:0;border-radius:0;margin-inline:-15px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:11.5px;background:var(--sunk)}
th .u{display:block;font-weight:400;font-size:10.5px;opacity:.8}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:200px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.bad{color:var(--crit);font-weight:600} td.warnc{color:var(--warn);font-weight:600} td.good{color:var(--ok)}
tr.err td{background:var(--crit-bg)}
tr.done td{color:var(--muted)}
tr.done td.tx{text-decoration:line-through}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:3px}
.hint{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:4px 10px;margin:8px 0}

.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--sunk);font-size:13px}
.al i{width:8px;height:8px;border-radius:50%}
.al.crit i{background:var(--crit)}.al.warn i{background:var(--warn)}.al.info i{background:var(--info)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.eqc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.eqc:hover{border-color:var(--muted)}
.eqc.ok{border-left-color:var(--ok)}.eqc.warn{border-left-color:var(--warn)}.eqc.crit{border-left-color:var(--crit)}.eqc.info{border-left-color:var(--info)}
.eqc .c{font-family:var(--f-mono);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.eqc .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.map{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--map-bg)}
.map svg{display:block;width:100%;height:auto}
.map text{font-family:var(--f-mono);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px}
.map .bench{fill:var(--map-bench);stroke:var(--map-line);stroke-width:1.2}
.map .hz{font-size:11px;fill:var(--muted)}
.map .route{stroke:var(--accent);stroke-linecap:round;opacity:.75;fill:none}
.map .eq{cursor:pointer;stroke:var(--surface);stroke-width:2}
.map .eq.ok{fill:var(--ok)}.map .eq.warn{fill:var(--warn)}.map .eq.crit{fill:var(--crit)}.map .eq.info{fill:var(--info)}.map .eq.na{fill:var(--muted)}
.map .ar{fill:var(--surface);stroke:var(--ink);stroke-width:1.5;cursor:pointer}
.map .ar.dump{fill:var(--sunk)} .map .ar.crusher,.map .ar.plant{fill:var(--accent)} .map .ar.stock{fill:var(--series2)}
.map .danger{fill:var(--crit-bg);stroke:var(--crit);stroke-dasharray:6 5;stroke-width:1.5;opacity:.85}
.map.placing{cursor:crosshair;outline:2px solid var(--accent)}
.maptools{position:absolute;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px 14px;text-align:center;background:var(--sunk);cursor:pointer;display:block}
.drop.over,.drop:hover{border-color:var(--accent)}
.drop b{display:block;font-size:14px}
.dmp{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.dmp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.dmp-opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.dmp-opt span{font-size:12.5px;color:var(--muted)}
.dmp-opt:hover{border-color:var(--accent)}
.dmp-opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dmp-opt:focus-visible,.dmp button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop span{color:var(--muted);font-size:12.5px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px 20px;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(980px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,16,.45)}
dialog h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.fgrid .full{grid-column:1/-1}
.fgrid .sec{grid-column:1/-1;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--ink);font-size:14px;width:100%}
label.f textarea{min-height:72px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.dlg-foot .sp{flex:1}
.errs{color:var(--crit);font-size:13px;margin:8px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.spin{color:var(--muted);padding:40px 0;text-align:center}
.cal{display:grid;gap:2px;font-family:var(--f-mono);font-size:12px}
.cal div{padding:4px 2px;text-align:center;border-radius:4px;background:var(--sunk)}
.cal .d{background:var(--accent);color:var(--on-accent);font-weight:600}.cal .nn{background:var(--series);color:var(--bg);font-weight:600}.cal .h{background:none;color:var(--muted)}.cal .today{outline:2px solid var(--ink)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--series)}
.prog i.ok{background:var(--ok)}.prog i.warn{background:var(--warn)}.prog i.crit{background:var(--crit)}
@keyframes dxp{from{opacity:.25}to{opacity:.85}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

<script>
(() => {
/* =================== constants =================== */
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const SHIFT_NET=11; // чистое время смены, ч (12 ч минус обед/пересменка)
const EQT={truck:'Самосвал',excavator:'Экскаватор',bulldozer:'Бульдозер',drill:'Буровой станок',loader:'Погрузчик',other:'Прочее'};
const ST={work:{l:'В работе',c:'ok'},wait:{l:'Ожидание',c:'warn'},idle:{l:'Простой',c:'warn'},repair:{l:'Ремонт',c:'crit'},maint:{l:'ТО',c:'info'},off:{l:'Вне смены',c:'na'}};
const REASONS=['Ожидание погрузки','Ожидание разгрузки','Нет самосвалов','Холостой пробег','Внеплановый ремонт','Плановое ТО','Заправка','Взрывные работы','Отсутствие оператора','Погодные условия','Перестановка / переезд','Прочее'];
const AREAT={face:'Забой / уступ',crusher:'Дробилка (ККД)',stock:'Рудный склад',dump:'Отвал',plant:'Обогатительная фабрика',danger:'Опасная зона',other:'Прочее'};
const AREAST=['Планируется','В работе','Отработан'];
const MAT={ore:'Руда',waste:'Вскрыша'};
const WOK=['ТО','Ремонт плановый','Ремонт аварийный'];
const WOS=['Новая','В работе','Ожидает запчасти','Закрыта'];
const HSET={incident:'Несчастный случай',near_miss:'Опасная ситуация',violation:'Нарушение',hazard:'Опасный фактор'};
const SEV=['Низкая','Средняя','Высокая'];
const ATT={present:'Вышел',late:'Опоздал',absent:'Неявка',sick:'Больничный',leave:'Отпуск'};
const BRIG=['А','Б','В','Г'];
const ROLES=['Машинист экскаватора','Водитель самосвала','Машинист бульдозера','Машинист бурового станка','Горный мастер','Диспетчер','Слесарь-ремонтник','Электрослесарь','Взрывник','Маркшейдер','Геолог','Инженер по ОТ и ТБ'];
const MODS=[
  ['docs','↑','Загрузка документов'],['bi','10','Аналитика и KPI'],['prod','01','Добыча'],['fleet','02','Техника и транспорт'],['disp','03','Диспетчерская'],
  ['maint','04','ТО и ремонты'],['geo','05','Геология и маркшейдерия'],['mat','06','Отгрузка и весовая'],
  ['rep','—','Месячная отчётность'],['set','—','Настройки карьера']];
const COLLS=['docs','sites','areas','equipment','employees','workorders','parts','hse','permits','samples','survey','plans','shifts','reports'];

/* =================== utils =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&isFinite(v);
const fmt=(v,d=1)=>isNum(v)?v.toLocaleString('ru-RU',{maximumFractionDigits:d}):'—';
const fmtT=t=>isNum(t)?(Math.abs(t)>=1e6?fmt(t/1e6,1)+' млн':Math.abs(t)>=10000?fmt(t/1000,1)+' тыс.':fmt(t,0)):'—';
const pct=(a,b)=>isNum(a)&&isNum(b)&&b>0?a/b*100:null;
const sumBy=(a,f)=>a.reduce((s,x)=>{const v=f(x);return s+(isNum(v)?v:0);},0);
const groupBy=(a,f)=>a.reduce((m,x)=>{const k=f(x);(m[k]=m[k]||[]).push(x);return m;},{});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const dlab=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return +d+' '+MON[+m-1];};
const plab=p=>{const [y,m]=p.split('-');return MON[+m-1]+' '+y;};
const fmtDur=m=>m<60?Math.round(m)+' мин':Math.floor(m/60)+' ч '+pad(Math.round(m%60))+' мин';
const daysInMonth=p=>new Date(+p.slice(0,4),+p.slice(5,7),0).getDate();
function curShift(){const d=new Date(),h=d.getHours();if(h>=8&&h<20)return{date:dstr(d),n:1};if(h>=20)return{date:dstr(d),n:2};const y=new Date(d);y.setDate(y.getDate()-1);return{date:dstr(y),n:2};}
const shiftStart=(date,n)=>new Date(date+'T'+(n===1?'08:00':'20:00')+':00');
function shiftFrac(date,n){const f=(Date.now()-shiftStart(date,n))/(12*3600e3);return Math.max(0,Math.min(1,f));}
const shLab=(date,n)=>`${dlab(date)}, смена ${n} (${n===1?'08–20':'20–08'})`;
function parseNum(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return isFinite(v)?v:NaN;const t=String(v).replace(/[\s ]/g,'').replace(',','.');if(t==='')return null;const n=Number(t);return isFinite(n)?n:NaN;}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3400);}
function errMsg(e){if(e?.msg)return e.msg;return e?.code==='invalid_argument'?'Нет прав на запись. Попросите владельца дать доступ «Участник» или выше.':e?.code==='quota_exceeded'?'Хранилище заполнено: удалите старые записи.':'Не удалось сохранить. Попробуйте ещё раз.';}

/* =================== state & store =================== */
let db=null,user=null,canWrite=null,myId=null,myName='',mode='loading';
const D=Object.fromEntries(COLLS.map(c=>[c,[]]));const got=new Set();
let DEMO=null;
const V={sel:null,mod:'bi',date:null,n:null,per:30,tab:{},placing:null,mapSel:null,filter:{}};
const loaded=()=>mode==='offline'||(mode==='live'&&COLLS.every(c=>got.has(c)));
const demo=()=>V.forceDemo||mode==='offline'||(loaded()&&D.sites.length===0);
const all=c=>demo()?DEMO[c]:D[c];
const site=()=>all('sites').find(s=>s.id===V.sel);
const of=c=>all(c).filter(x=>x.siteId===V.sel);
const byId=(c,id)=>all(c).find(x=>x.id===id);
const canEdit=()=>demo()||(mode==='live'&&canWrite!==false);

async function put(c,id,obj){
  const body=clean(obj);delete body.id;
  if(demo()){const a=DEMO[c],i=a.findIndex(x=>x.id===id);const o={id,...body};if(i<0)a.push(o);else a[i]=o;render();return;}
  await db.collection(c).doc(id).set(body);
}
async function patch(c,id,obj){const cur=byId(c,id)||{};await put(c,id,{...cur,...obj});}
async function del(c,id){if(demo()){const a=DEMO[c],i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);render();return;}await db.collection(c).doc(id).delete();}
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>v===undefined||(typeof v==='number'&&!isFinite(v))?null:v));}
async function safe(fn,ok){try{await fn();if(ok)toast(ok);return true;}catch(e){console.error(e);toast(errMsg(e));return false;}}

/* shifts */
const shId=(date,n)=>`${V.sel}_${date}_${n}`;
const blankShift=(date,n)=>({siteId:V.sel,date,n,status:'open',plan:{},trips:[],dt:[],ev:[],tasks:[],fuel:[],checks:{},crew:{},att:{},handover:null});
function getShift(date,n){const s=byId('shifts',shId(date,n));return s?{...blankShift(date,n),...s}:blankShift(date,n);}
async function updShift(date,n,fn){const s=clone(getShift(date,n));fn(s);s.updatedAt=new Date().toISOString();if(myId)s.by=myId;await put('shifts',shId(date,n),s);}
function shiftsIn(from,to){return of('shifts').filter(s=>s.date>=from&&s.date<=to).map(s=>({...blankShift(s.date,s.n),...s})).sort((a,b)=>a.date===b.date?a.n-b.n:a.date<b.date?-1:1);}
function periodRange(){const t=today();if(V.per==='m'){return{from:t.slice(0,8)+'01',to:t,lab:'с начала месяца'};}return{from:addD(t,-(V.per-1)),to:t,lab:'за '+V.per+' дн.'};}

/* brigade rotation: Д Д Н Н В В В В */
function brigadeOn(date,n){const s=site();const k=daysBetween(s?.rotStart||'2026-01-01',date);for(let o=0;o<4;o++){const p=((k-2*o)%8+8)%8;if((n===1&&p<2)||(n===2&&(p===2||p===3)))return BRIG[o];}return '—';}

/* =================== aggregations =================== */
function involved(sh,eqId){return !!(sh.crew?.[eqId]||sh.trips.some(t=>t.truck===eqId||t.exc===eqId)||sh.fuel.some(f=>f.eq===eqId)||sh.dt.some(d=>d.eq===eqId));}
function dtMin(sh,eqId){return sumBy(sh.dt.filter(d=>d.eq===eqId),d=>d.min);}
function workH(sh,eqId){return involved(sh,eqId)?Math.max(0,SHIFT_NET-dtMin(sh,eqId)/60):0;}
const tons=t=>isNum(t.scale)?t.scale:t.tons;
function agg(shs){
  const trips=shs.flatMap(s=>s.trips.map(t=>({...t,date:s.date,n:s.n})));
  const ore=sumBy(trips.filter(t=>t.mat==='ore'),tons),waste=sumBy(trips.filter(t=>t.mat==='waste'),tons);
  return{trips,ore,waste,rock:ore+waste};
}
function monthPlan(p){return byId('plans',`${V.sel}_${p}`)||null;}
function shiftPlan(sh){
  const pl=sh.plan||{};const areas=Object.keys(pl);
  if(areas.length)return{ore:sumBy(areas,a=>pl[a].ore),waste:sumBy(areas,a=>pl[a].waste),byArea:pl,explicit:true};
  const mp=monthPlan(sh.date.slice(0,7));if(!mp)return{ore:null,waste:null,byArea:{},explicit:false};

/* per-equipment stats over shifts */
function eqStats(shs){

  eqs.forEach(e=>m[e.id]={eq:e,trips:0,tons:0,wh:0,dt:0,fuel:0,cyc:[],shifts:0,wait:0});
  shs.forEach(sh=>{
    eqs.forEach(e=>{const w=workH(sh,e.id);if(w>0||involved(sh,e.id)){m[e.id].wh+=w;m[e.id].shifts++;}m[e.id].dt+=dtMin(sh,e.id);});
    sh.dt.forEach(d=>{if(m[d.eq]&&/Ожидание|Холостой|Нет самосвалов/.test(d.reason))m[d.eq].wait+=d.min||0;});
    const byTruck=groupBy(sh.trips,t=>t.truck);
    sh.trips.forEach(t=>{const v=tons(t)||0;if(m[t.truck]){m[t.truck].trips++;m[t.truck].tons+=v;}if(m[t.exc]){m[t.exc].trips++;m[t.exc].tons+=v;}});
    Object.entries(byTruck).forEach(([id,ts])=>{if(!m[id])return;const ms=ts.map(t=>{const [h,mi]=t.t.split(':').map(Number);let x=h*60+mi;if(sh.n===2&&h<8)x+=1440;return x;}).sort((a,b)=>a-b);for(let i=1;i<ms.length;i++){const c=ms[i]-ms[i-1];if(c>5&&c<180)m[id].cyc.push(c);}});
    sh.fuel.forEach(f=>{if(m[f.eq])m[f.eq].fuel+=f.l||0;});
  });
  Object.values(m).forEach(x=>{x.cycle=x.cyc.length?x.cyc.reduce((a,b)=>a+b,0)/x.cyc.length:null;x.lph=x.wh>0&&x.fuel>0?x.fuel/x.wh:null;x.tph=x.wh>0&&x.tons>0?x.tons/x.wh:null;x.lpt=x.tons>0&&x.fuel>0?x.fuel/x.tons:null;});

}
function partsCost(from,to){return sumBy(of('workorders').filter(w=>(w.closed||w.opened||'')>=from&&(w.closed||w.opened||'')<=to),w=>sumBy(w.parts||[],p=>(p.qty||0)*(p.price||0)));}
function costs(shs,from,to){
  const st=eqStats(shs),s=site(),fp=s?.fuelPrice||380;const a=agg(shs);
  let fuel=0,hours=0;Object.values(st).forEach(x=>{fuel+=x.fuel*fp;hours+=x.wh*(x.eq.hourCost||0);});
  const parts=partsCost(from,to);const total=fuel+hours+parts;

  let rep=0;of('workorders').forEach(w=>{const o=w.opened||'',c=w.closed||to;if(c<from||o>to)return;rep+=w.hours||0;});

/* failure prediction (Weibull β=2 over motohour history) */
function failRisk(e){

  const mtbf=f.length>=2?(f[f.length-1].motoh-f[0].motoh)/(f.length-1):f[0].motoh;if(!(mtbf>0))return null;
  const eta=mtbf/0.8862,since=Math.max(0,e.motoh-f[f.length-1].motoh),R=t=>Math.exp(-Math.pow(t/eta,2));

}

}

function alerts(){

  of('equipment').forEach(e=>{
    if((e.status==='wait'||e.status==='idle')&&e.statusAt){const m=(now-new Date(e.statusAt))/6e4;if(m>15)out.push({mod:'disp',c:m>60?'crit':'warn',t:`${e.code}: ${ST[e.status].l.toLowerCase()} ${fmtDur(m)}${e.reason?' — '+e.reason:''}`,eq:e.id});}
    if(e.status==='repair'&&!of('workorders').some(w=>w.eqId===e.id&&w.status!=='Закрыта'))out.push({mod:'maint',c:'warn',t:`${e.code} в ремонте без заявки`,eq:e.id});

  });

  const day=agg(shiftsIn(t,t)).trips.filter(t=>isNum(t.scale));if(day.length>5){const a=sumBy(day,x=>x.tons),b=sumBy(day,x=>x.scale);const d=Math.abs(a-b)/b*100;if(d>3)out.push({mod:'mat',c:'warn',t:`Расхождение диспетчер/весовая за сутки: ${fmt(d,1)}%`});}

const tbl=(head,rows,emptyMsg='Записей нет')=>rows.length?`<div class="tbl-wrap"><table><thead><tr>${head.map(h=>Array.isArray(h)?`<th class="n">${h[0]}${h[1]?`<span class="u">${h[1]}</span>`:''}</th>`:`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty(emptyMsg);
const eb=(act,id,l='Изменить')=>canEdit()?`<button class="btn sm ghost" data-act="${act}" data-id="${esc(id)}">${l}</button>`:'';
function daysOf(from,to){const a=[];for(let d=from;d<=to;d=addD(d,1))a.push(d);return a;}
function dayPlan(d){return [1,2].reduce((s,n)=>{const p=shiftPlan(getShift(d,n));return{ore:(s.ore??0)+(p.ore??0),waste:(s.waste??0)+(p.waste??0),has:s.has||p.ore!=null};},{ore:null,waste:null,has:false});}

/* =================== 10 · BI =================== */
function vBI(){
  const{from,to,lab}=periodRange();const shs=shiftsIn(from,to);const a=agg(shs),fc=forecast(),c=costs(shs,from,to),k=ktg(from,to);
  const st=Object.values(c.st);const eqSh=sumBy(st,x=>x.shifts);const useful=eqSh?sumBy(st,x=>x.wh)/(eqSh*12)*100:null;
  const days=daysOf(from,to),dp=days.map(dayPlan),planOre=sumBy(dp,p=>p.ore);
  const ore=days.map(d=>agg(shs.filter(s=>s.date===d)).ore);
  const reasons=groupBy(shs.flatMap(s=>s.dt),d=>d.reason);const par=Object.entries(reasons).map(([l,a])=>({l,v:sumBy(a,x=>x.min)/60})).sort((x,y)=>y.v-x.v).slice(0,8);
  const exc=st.filter(x=>x.eq.type==='excavator'&&x.tph).sort((p,q)=>q.tph-p.tph).map(x=>({l:`${x.eq.code} · ${x.eq.model||''}`,v:x.tph}));
  const trucks=st.filter(x=>x.eq.type==='truck'&&x.shifts);
  const byN=[1,2].map(n=>{const s=shs.filter(x=>x.n===n);return{l:`Смена ${n} (${n===1?'день':'ночь'})`,v:s.length?agg(s).rock/s.length:0};});
  const byOwner=Object.entries(groupBy(trucks,x=>x.eq.owner||'Собственная')).map(([l,a])=>({l,v:sumBy(a,x=>x.tons),h:sumBy(a,x=>x.wh)}));
  const byArea=Object.entries(groupBy(a.trips,t=>t.from)).map(([id,ts])=>({l:code('areas',id),v:sumBy(ts,tons)})).sort((x,y)=>y.v-x.v);
  const al=alerts();
  return head('10','Аналитика и KPI',`<span>Период: ${lab} (${dlab(from)} — ${dlab(to)})</span><span>${shs.length} смен в данных</span>`)+perBar()+
  `<div class="kpis">
   ${kpi('Добыча руды',fmtT(a.ore),'т',pctPill(pct(a.ore,planOre))+' плана')}
   ${kpi('Вскрыша',fmtT(a.waste),'т',`коэф. ${a.ore?fmt(a.waste/a.ore,2):'—'} т/т`)}
   ${kpi('Горная масса',fmtT(a.rock),'т',`${fmt(a.trips.length,0)} рейсов`)}
   ${kpi('Прогноз плана месяца',fc.pctProj===null?'—':fmt(fc.pctProj,0),'%',fc.plan?`прогноз ${fmtT(fc.proj)} из ${fmtT(fc.plan)} т`:'месячный план не задан')}
   ${kpi('КТГ парка',fmt(k,1),'%','техническая готовность')}
   ${kpi('Полезное время',fmt(useful,1),'%','от календарного фонда смен')}
   ${kpi('Топливо на тонну',a.rock?fmt(c.fuelL/a.rock,3):'—','л/т',`${fmtT(c.fuelL)} л всего`)}
   ${kpi('Себестоимость',fmt(c.cpt,0),'тг/т','горной массы, оценка')}
  </div>
  <div class="panel"><h3>Раннее выявление отклонений<span class="sp"></span><span class="hint">${al.length} сигнал(ов)</span></h3>${alertList(al.slice(0,10))}</div>
  <div class="grid2">
   <div class="panel chart"><h3>План / факт добычи руды по суткам</h3><p class="cap">т в сутки</p>${colChart(days.map(dlab),ore,dp.map(p=>p.has?p.ore:null),{unit:'т'})}<div class="legend"><span><i style="background:var(--series)"></i>Факт</span><span><i style="background:var(--accent);height:3px;vertical-align:3px"></i>План</span></div></div>
   <div class="panel chart"><h3>Причины простоев</h3><p class="cap">машино-часы за период, все единицы</p>${hbars(par,{unit:'ч',d:0})}</div>
   <div class="panel chart"><h3>Производительность экскаваторов</h3><p class="cap">т горной массы на час работы</p>${hbars(exc,{unit:'т/ч'})}</div>
   <div class="panel chart"><h3>Производительность по сменам</h3><p class="cap">т горной массы в среднем за смену</p>${hbars(byN,{unit:'т'})}</div>
  </div>
  <div class="grid2">
   <div class="panel"><h3>Самосвалы</h3><p class="cap">за период</p>${tbl(['Борт','Модель',['Рейсов'],['Перевезено','т'],['т/рейс'],['Рейсов/смену'],['Цикл','мин'],['т/ч']],trucks.sort((p,q)=>q.tons-p.tons).map(x=>`<tr><td><b>${esc(x.eq.code)}</b></td><td>${esc(x.eq.model)}</td><td class="n">${x.trips}</td><td class="n">${fmt(x.tons,0)}</td><td class="n">${x.trips?fmt(x.tons/x.trips,1):'—'}</td><td class="n">${x.shifts?fmt(x.trips/x.shifts,1):'—'}</td><td class="n">${fmt(x.cycle,0)}</td><td class="n">${fmt(x.tph,0)}</td></tr>`))}</div>
   <div class="panel"><h3>Подрядчики и участки</h3><p class="cap">перевезено, т</p>${tbl(['Владелец техники',['Перевезено','т'],['Маш.-часы'],['т/ч']],byOwner.map(o=>`<tr><td>${esc(o.l)}</td><td class="n">${fmt(o.v,0)}</td><td class="n">${fmt(o.h,0)}</td><td class="n">${o.h?fmt(o.v/o.h,0):'—'}</td></tr>`))}
   <div style="height:10px"></div>${tbl(['Участок погрузки',['Горная масса','т'],['Доля','%']],byArea.map(x=>`<tr><td>${esc(x.l)}</td><td class="n">${fmt(x.v,0)}</td><td class="n">${fmt(pct(x.v,a.rock),1)}</td></tr>`))}</div>
  </div>`;
}

      ${pl.explicit?'':`<p class="note">План смены по участкам не задан — показан план из месячного плана, разделённый поровну на смены. Нажмите «План смены», чтобы задать по участкам.</p>`}
      <div class="panel"><h3>Выполнение плана по участкам и уступам</h3><p class="cap">${shLab(V.date,V.n)} · т</p>${tbl(['Участок / уступ',['План руда'],['Факт руда'],['План вскр.'],['Факт вскр.'],['Рейсов'],'Экскаваторы','Выполнение',['%']],rows,'В этой смене нет плана и рейсов')}</div>

      ${kpi('Прогноз руды на месяц',fmtT(fc.proj),'т',fc.pctProj!==null?pctPill(fc.pctProj)+' плана':'')}${kpi('Прогноз вскрыши',fmtT(fc.projW),'т',fc.planW?pctPill(pct(fc.projW,fc.planW))+' плана':'')}
      ${kpi('Текущий темп',fmtT(fc.rateDay),'т/сут','руда')}${kpi('Нужный темп до конца месяца',fc.need===null?'—':fmtT(fc.need),'т/сут',fc.need!==null?(fc.need>fc.rateDay*1.05?'<span class="pill crit">выше текущего</span>':'<span class="pill ok">достижим</span>'):'')}</div>

  }

}

  }else{

    tbl(['Месяц','Участок',['Проект','м³'],['Факт','м³'],['Откл.','%'],['Контур','м'],['По замеру','т'],['По диспетчеру','т'],['Расхожд.','%'],['Потери','%'],['Разубож.','%'],''],sv.map(x=>{const ar=byId('areas',x.areaId);const dens=ar?.ore?(s.densOre||2.7):(s.densWaste||2.5);const st=x.actual_m3*dens;
      const disp=sumBy(of('shifts').filter(sh=>sh.date.startsWith(x.period)).flatMap(sh=>(sh.trips||[]).filter(t=>t.from===x.areaId)),tons);const d=disp?pct(disp-st,st):null;const dv=pct(x.actual_m3-x.design_m3,x.design_m3);
      return `<tr><td>${plab(x.period)}</td><td>${esc(ar?.name||'—')}</td><td class="n">${fmt(x.design_m3,0)}</td><td class="n">${fmt(x.actual_m3,0)}</td><td class="n ${dv!==null&&Math.abs(dv)>5?'warnc':''}">${fmt(dv,1)}</td><td class="n ${Math.abs(x.contour_dev_m||0)>1?'warnc':''}">${fmt(x.contour_dev_m,1)}</td><td class="n">${fmt(st,0)}</td><td class="n">${disp?fmt(disp,0):'—'}</td><td class="n ${d!==null&&Math.abs(d)>5?'bad':''}">${fmt(d,1)}</td><td class="n">${fmt(x.loss_pct,1)}</td><td class="n">${fmt(x.dilution_pct,1)}</td><td>${eb('survey-edit',x.id)}</td></tr>`;}),'Замеров нет')+
    `<p class="note">«По замеру, т» = фактический объём × плотность (руда ${fmt(s.densOre||2.7,2)}, вскрыша ${fmt(s.densWaste||2.5,2)} т/м³). Диспетчерские тонны считаются только по сменам, загруженным в платформу.</p>`;

    const byT=Object.entries(groupBy(tr,x=>x.truck)).map(([id,a])=>({id,n:a.length,d:sumBy(a,x=>x.tons),s:sumBy(a,x=>x.scale)})).map(x=>({...x,p:pct(x.d-x.s,x.s)})).sort((a,b)=>Math.abs(b.p)-Math.abs(a.p));
    const D=sumBy(tr,x=>x.tons),S=sumBy(tr,x=>x.scale);

    <div class="panel"><h3>Диспетчер vs весовая по самосвалам</h3><p class="cap">${lab}; расхождение > 3% обычно означает неверную номинальную загрузку или недогруз</p>${tbl(['Самосвал',['Рейсов'],['Диспетчер','т'],['Весы','т'],['Δ','т'],['Δ','%'],['Ср. загрузка по весам','т']],byT.map(x=>`<tr><td><b>${esc(code('equipment',x.id))}</b></td><td class="n">${x.n}</td><td class="n">${fmt(x.d,0)}</td><td class="n">${fmt(x.s,0)}</td><td class="n">${fmt(x.d-x.s,0)}</td><td class="n ${Math.abs(x.p)>3?'bad':''}">${fmt(x.p,1)}</td><td class="n">${fmt(x.s/x.n,1)}</td></tr>`),'Нет взвешенных рейсов за период')}</div>
    <p class="note">Сверка с маркшейдерским замером (производственный учёт) — в модуле «Геология и маркшейдерия», вкладка «Маркшейдерские замеры».</p>`;
  }else{
    html+=shiftBar()+`<div class="grid3"><div class="panel"><h3>Сменный отчёт</h3><p class="cap">Все рейсы смены с массой по диспетчеру и весам</p><button class="btn" data-act="dl-shift">Скачать CSV</button></div><div class="panel"><h3>Суточный отчёт</h3><p class="cap">Сводка по участкам погрузки и пунктам разгрузки за ${dlab(V.date)}</p><button class="btn" data-act="dl-day">Скачать CSV</button></div><div class="panel"><h3>Реестр за период</h3><p class="cap">Сменные итоги: руда, вскрыша, рейсы, простои — за 30 дней</p><button class="btn" data-act="dl-period">Скачать CSV</button></div></div>`;
  }

/* =================== 02 · Fleet: fuel & cost tabs =================== */
function fuelBody(t){
  const s=site();
  let html=`<p class="hint" style="margin:-4px 0 10px">Цена дизтоплива: <b>${fmt(s.fuelPrice||380,0)} тг/л</b> (меняется в «Настройках карьера»)</p>`;
  if(t==='fill'){
    const sh=getShift(V.date,V.n);
    html+=shiftBar()+tbl(['Время','Техника',['Литры'],['Моточасы'],''],(sh.fuel||[]).slice().sort((a,b)=>a.t<b.t?1:-1).map(f=>`<tr><td class="num">${esc(f.t)}</td><td><b>${esc(code('equipment',f.eq))}</b></td><td class="n">${fmt(f.l,0)}</td><td class="n">${fmt(f.mh,0)}</td><td>${eb('fuel-del',f.id,'Удалить')}</td></tr>`),'Заправок в смене нет')+`<p class="hint" style="margin-top:8px">Итого за смену: <b>${fmt(sumBy(sh.fuel||[],f=>f.l),0)} л</b>. Показание моточасов при заправке обновляет счётчик в карточке техники.</p>`;
  }else if(t==='use'){
    const{from,to,lab}=periodRange();const shs=shiftsIn(from,to);const st=eqStats(shs);const an=new Set(fuelAnoms(st).map(x=>x.eq.id));
    const rows=Object.values(st).filter(x=>x.fuel>0).sort((a,b)=>(an.has(b.eq.id)?1:0)-(an.has(a.eq.id)?1:0)||b.fuel-a.fuel);
    const byN=[1,2].map(n=>{const ss=shs.filter(x=>x.n===n);const a=agg(ss);const l=sumBy(ss.flatMap(x=>x.fuel),f=>f.l);return{n,l,t:a.rock};});
    html+=perBar()+`<div class="kpis">${kpi('Израсходовано',fmtT(sumBy(rows,x=>x.fuel)),'л',lab)}${kpi('Аномалий',an.size,'ед.',an.size?'<span class="pill warn">проверить</span>':'<span class="pill ok">нет</span>')}${byN.map(x=>kpi(`Смена ${x.n}: л на тонну`,x.t?fmt(x.l/x.t,3):'—','л/т',`${fmtT(x.l)} л · ${fmtT(x.t)} т`)).join('')}</div>`+
    tbl(['Техника','Тип',['Топливо','л'],['Работа','ч'],['Факт','л/моточ.'],['Норма','л/моточ.'],['Откл.','%'],['Объём работ','т'],['На тонну','л/т'],''],rows.map(x=>{const dv=x.eq.fuelNorm&&x.lph?pct(x.lph-x.eq.fuelNorm,x.eq.fuelNorm):null;return `<tr><td><b>${esc(x.eq.code)}</b> <span class="hint">${esc(x.eq.model)}</span></td><td>${EQT[x.eq.type]}</td><td class="n">${fmt(x.fuel,0)}</td><td class="n">${fmt(x.wh,0)}</td><td class="n">${fmt(x.lph,1)}</td><td class="n">${fmt(x.eq.fuelNorm,1)}</td><td class="n ${dv>15?'bad':dv>5?'warnc':''}">${fmt(dv,1)}</td><td class="n">${fmt(x.tons,0)}</td><td class="n">${fmt(x.lpt,3)}</td><td>${an.has(x.eq.id)?'<span class="pill crit">аномалия</span>':''}</td></tr>`;}),'Нет заправок за период')+
    `<p class="note">Аномалия: расход на моточас выше нормы более чем на 15% или выше медианы машин того же типа более чем на 25%. Причины — утечки, слив, неисправность ДВС, длительный холостой ход.</p>`;
  }else{
    const{from,to,lab}=periodRange();const shs=shiftsIn(from,to);const c=costs(shs,from,to);const days=daysOf(from,to);
    const daily=days.map(d=>{const ss=shs.filter(x=>x.date===d);const cc=costs(ss,d,d);return cc.cpt;});
    const rows=Object.values(c.st).filter(x=>x.wh>0).map(x=>{const f=x.fuel*(s.fuelPrice||380),h=x.wh*(x.eq.hourCost||0);return{...x,f,h,tot:f+h,cpt:x.tons?(f+h)/x.tons:null};}).sort((a,b)=>b.tot-a.tot);
    const byType=Object.entries(groupBy(rows,x=>x.eq.type)).map(([k,a])=>({l:EQT[k],v:sumBy(a,x=>x.tot)})).sort((a,b)=>b.v-a.v);
    const byN=[1,2].map(n=>{const ss=shs.filter(x=>x.n===n);const cc=costs(ss,from,to);return{l:'Смена '+n,v:cc.rock?(cc.fuel+cc.hours)/cc.rock:0};});
    const trips=agg(shs).trips;const ec={};rows.forEach(x=>ec[x.eq.id]=x.trips?x.tot/x.trips:0);const direct=sumBy(trips,x=>(ec[x.truck]||0)+(ec[x.exc]||0));const rest=Math.max(0,c.total-direct);
    const byArea=Object.entries(groupBy(trips,x=>x.from)).map(([id,a])=>{const tn=sumBy(a,tons);const cost=sumBy(a,x=>(ec[x.truck]||0)+(ec[x.exc]||0))+rest*tn/(c.rock||1);return{l:code('areas',id),v:tn,cost};}).sort((p,q)=>q.cost/q.v-p.cost/p.v);
    html+=perBar()+`<div class="kpis">${kpi('Затраты всего',fmtT(c.total),'тг',lab)}${kpi('Топливо',fmtT(c.fuel),'тг',fmt(pct(c.fuel,c.total),0)+'% затрат')}${kpi('Машино-часы',fmtT(c.hours),'тг','амортизация, ЗП, прочее')}${kpi('Запчасти',fmtT(c.parts),'тг','по закрытым заявкам')}${kpi('Себестоимость горной массы',fmt(c.cpt,0),'тг/т')}${kpi('Себестоимость руды',c.ore?fmt(c.total/c.ore,0):'—','тг/т','все затраты на тонну руды')}</div>
    <div class="grid2"><div class="panel chart"><h3>Себестоимость тонны по суткам</h3><p class="cap">тг/т горной массы</p>${lineChart(days.map(dlab),daily,{d:0,unit:'тг/т'})}</div><div class="panel chart"><h3>Затраты по типам техники</h3><p class="cap">тг за период</p>${hbars(byType)}</div>
    <div class="panel chart"><h3>Сравнение смен</h3><p class="cap">тг/т горной массы (топливо + маш.-часы)</p>${hbars(byN,{unit:'тг/т'})}</div><div class="panel"><h3>Распределение по участкам</h3><p class="cap">самосвалы и экскаваторы — по рейсам с участка, прочие затраты — пропорционально массе</p>${tbl(['Участок',['Масса','т'],['Затраты','тг'],['тг/т']],byArea.map(x=>`<tr><td>${esc(x.l)}</td><td class="n">${fmt(x.v,0)}</td><td class="n">${fmt(x.cost,0)}</td><td class="n">${fmt(x.cost/x.v,0)}</td></tr>`))}</div></div>
    <div class="panel"><h3>Стоимость эксплуатации по машинам</h3>${tbl(['Техника','Владелец',['Работа','ч'],['Топливо','тг'],['Маш.-часы','тг'],['Итого','тг'],['Объём','т'],['тг/т']],rows.map(x=>`<tr><td><b>${esc(x.eq.code)}</b> <span class="hint">${esc(x.eq.model)}</span></td><td>${esc(x.eq.owner)}</td><td class="n">${fmt(x.wh,0)}</td><td class="n">${fmt(x.f,0)}</td><td class="n">${fmt(x.h,0)}</td><td class="n">${fmt(x.tot,0)}</td><td class="n">${fmt(x.tons,0)}</td><td class="n">${fmt(x.cpt,0)}</td></tr>`))}</div>
    <p class="note">Стоимость маш.-часа задаётся в карточке техники, цена топлива — в настройках карьера.</p>`;
  }
  return html;
}

/* ---- text extraction ---- */
function linesFromItems(items){const rows=[];items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]/3),x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<=1);if(!r){r={y,c:[]};rows.push(r);}r.c.push({x,s:it.str});});
  return rows.sort((a,b)=>b.y-a.y).map(r=>r.c.sort((a,b)=>a.x-b.x).map(c=>c.s).join(' ').replace(/\s{2,}/g,' ').trim()).filter(Boolean).join('\n');}
function htmlToText(html){html=html.replace(/<(td|th)([^>]*)>([\s\S]*?)<\/\1>/gi,(m,t,at,inner)=>'<'+t+at+'>'+inner.replace(/<\/?p[^>]*>/gi,' ').trim()+'</'+t+'>');html=html.replace(/<\/(td|th)>/gi,' | ').replace(/<\/tr>/gi,'\n').replace(/<\/(p|h\d|li)>/gi,'\n').replace(/<br\s*\/?>/gi,'\n');const doc=new DOMParser().parseFromString(html,'text/html');return (doc.body.textContent||'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();}
function sheetLines(ws){
  if(!ws['!ref'])return [];const r=XLSX.utils.decode_range(ws['!ref']);const out=[];
  const fv=v=>typeof v==='number'?String(Math.round(v*1000)/1000):String(v).replace(/\s+/g,' ').trim();
  for(let R=r.s.r;R<=r.e.r;R++){const cells=[];for(let C=r.s.c;C<=r.e.c;C++){const c=ws[XLSX.utils.encode_cell({r:R,c:C})];if(!c||c.t==='e'||c.v===''||c.v==null)continue;const v=c.v instanceof Date?dstr(c.v):fv(c.v);if(!v||/^#/.test(v))continue;cells.push(XLSX.utils.encode_col(C)+'='+v);}
    if(cells.length)out.push((R+1)+': '+cells.join(' | '));}
  return out;
}
/* a "part" = one Claude call: {text} or {images} */
function packSheets(sheets){
  const parts=[];let cur='';
  sheets.forEach(({name,lines})=>{const head=lines.slice(0,14).join('\n');let block=`=== Лист «${name}» (строка: колонка=значение) ===\n`;
    lines.forEach((l,i)=>{if(block.length+l.length>DXMAX){if(cur){parts.push(cur);cur='';}parts.push(block);block=`=== Лист «${name}», продолжение. Заголовки листа: ===\n${head}\n=== строки ===\n`;}block+=l+'\n';});
    if(cur.length+block.length>DXMAX&&cur){parts.push(cur);cur='';}cur+=block+'\n';});
  if(cur.trim())parts.push(cur);return parts;
}
function chunkText(t){const out=[];let cur='';t.split('\n').forEach(l=>{if(cur.length+l.length>DXMAX&&cur){out.push(cur);cur='';}cur+=l+'\n';});if(cur.trim())out.push(cur);return out.map(c=>c.slice(0,DXMAX*1.3));}
async function extractDoc(file,progress){
  const name=file.name||'',ext=(name.split('.').pop()||'').toLowerCase(),type=file.type||'';
  if(/^image\//.test(type)||['jpg','jpeg','png','webp','gif'].includes(ext)){if(!SAMPLE_LIM?.images)throw{msg:'Фото и сканы в этом просмотре читать нельзя. Загрузите PDF с текстом, Word или Excel.'};return{images:[file]};}
  if(ext==='pdf'){
    progress('Открываю PDF');await loadLib('pdf');const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let text='';
    for(let i=1;i<=pdf.numPages;i++){progress(`Читаю текст: страница ${i} из ${pdf.numPages}`);const pg=await pdf.getPage(i);text+=`\n--- Страница ${i} ---\n`+linesFromItems((await pg.getTextContent()).items);}
    if(text.replace(/--- Страница \d+ ---/g,'').replace(/\s/g,'').length>=60*pdf.numPages)return{texts:chunkText(text)};
    if(!SAMPLE_LIM?.images)throw{msg:'Это скан без текстового слоя, а изображения в этом просмотре читать нельзя. Загрузите PDF с текстом, Word или Excel.'};
    const max=Math.min(pdf.numPages,12),imgs=[];
    for(let i=1;i<=max;i++){progress(`Готовлю скан: страница ${i} из ${max}`);const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)));}
    return{images:imgs,cut:pdf.numPages>max?pdf.numPages:0};
  }
  if(ext==='docx'){progress('Открываю документ Word');await loadLib('docx');const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});return{texts:chunkText(htmlToText(r.value))};}
  if(['xlsx','xls','xlsm','xlsb','ods'].includes(ext)){progress('Открываю таблицу Excel');await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const sheets=wb.SheetNames.map(n=>({name:n,lines:sheetLines(wb.Sheets[n])})).filter(s=>s.lines.length);return{texts:packSheets(sheets),sheets:sheets.map(s=>s.name)};}
  if(['csv','txt','tsv','md'].includes(ext)||/^text\//.test(type)){const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\uFFFD'))t=new TextDecoder('windows-1251').decode(buf);return{texts:chunkText(t)};}
  if(ext==='doc')throw{msg:'Формат .doc (Word 97–2003) не читается. Сохраните документ как .docx или PDF.'};
  throw{msg:'Этот формат не поддерживается. Загрузите Excel, PDF, Word (.docx), CSV, текст или фото.'};
}

const L2C={a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у'};
const nz=s=>String(s??'').toLowerCase().replace(/ё/g,'е').replace(/[abcehkmoptxy]/g,c=>L2C[c]).replace(/[\s\-–—_.,«»"'№#()]/g,'');
const digits=s=>(String(s??'').match(/\d+/g)||[]).join('');
function resEq(v,types){if(v==null||v==='')return null;const n=nz(v),E=of('equipment');const T=types?E.filter(x=>types.includes(x.type)):E;
  let e=E.find(x=>nz(x.code)===n&&(!types||types.includes(x.type)))||E.find(x=>nz(x.code)===n);
  if(!e&&/[^\d]/.test(n))e=T.find(x=>nz(x.code).length>=3&&n.length>=3&&(n.endsWith(nz(x.code))||n.startsWith(nz(x.code))));
  if(!e&&(types||/[^\d]/.test(n))){const d=digits(v);if(d){const c=T.filter(x=>digits(x.code)===d);if(c.length===1)e=c[0];}}return e?.id||null;}
function resArea(v){if(v==null||v==='')return null;const n=nz(v),A=of('areas');let a=A.find(x=>nz(x.name)===n)||A.find(x=>n.length>=4&&(nz(x.name).includes(n)||n.includes(nz(x.name))));
  if(!a){const h=(String(v).match(/\d{3,4}/)||[])[0];if(h){const c=A.filter(x=>String(x.horizon)===h);if(c.length===1)a=c[0];}}
  if(!a){const by=t=>{const c=A.filter(x=>x.type===t);return c.length===1?c[0]:null;};if(/ккд|дробил/.test(n))a=by('crusher');else if(/отвал/.test(n))a=by('dump');else if(/склад/.test(n))a=by('stock');else if(/фабрик|^оф$/.test(n))a=by('plant');}
  return a?.id||null;}
function resEmp(v){if(v==null||v==='')return null;const n=nz(v),P=of('employees');let p=P.find(x=>nz(x.name)===n);if(!p){const sur=nz(String(v).trim().split(/\s+/)[0]);const c=P.filter(x=>nz(String(x.name).split(/\s+/)[0])===sur);if(c.length===1)p=c[0];}return p?.id||null;}
const numv=v=>{const n=parseNum(v);return Number.isNaN(n)?null:n;};

/* ---- merge parts ---- */
function mergeRes(list){
  const M={notes:[],month_plans:[],equipment:[],areas:[],contractors:[],shift:null};
  const arr=['employees','workorders','parts','hse','permits','samples','survey','monthly_facts'];arr.forEach(k=>M[k]=[]);
  list.forEach(r=>{if(!r||typeof r!=='object')return;
    ['doc_type','summary','site_hint','org'].forEach(k=>{if(!M[k]&&r[k])M[k]=r[k];});
    (r.notes||[]).forEach(n=>{n=String(n);if(!M.notes.includes(n))M.notes.push(n);});

      R.dt.filter(x=>dxOk('dt',x)&&x.from&&x.to).forEach(x=>{s.dt.push({id:uid(),eq:x.eq,reason:x.reason,from:x.from,to:x.to,min:mins(x.from,x.to),note:x.note||'',src:'doc'});inc('dt');});
      R.ev.filter(x=>x.on).forEach(x=>{s.ev.push({id:uid(),t:x.t||hm(now),type:x.type,text:x.text,src:'doc'});inc('ev');});
      R.tasks.filter(x=>x.on).forEach(x=>{s.tasks.push({id:uid(),text:x.text,area:x.area||null,done:x.done});inc('tasks');});
      R.fuel.filter(x=>dxOk('fuel',x)).forEach(x=>{s.fuel.push({id:uid(),eq:x.eq,t:x.t||hm(now),l:x.l,mh:x.mh??null});inc('fuel');});

      if(R.hand)s.ev.push({id:uid(),t:hm(now),type:'info',text:'Из документа, передача смены: '+R.hand,src:'doc'});
      s.docs=s.docs||[];s.docs.push({name:V.dx.file.name,size:V.dx.file.size,at:now.toISOString(),by:myId||null});
    });

    for(const x of R.fuel.filter(x=>dxOk('fuel',x)&&isNum(x.mh))){const e=byId('equipment',x.eq);if(e&&x.mh>(e.motoh||0))await patch('equipment',e.id,{motoh:x.mh});}

  const pers=R.mp.filter(p=>p.on).map(p=>p.period).concat([...perEq]).sort();if(pers.length)V.filter.pgr=pers[0];

}

  const per=V.filter.pgr&&ps.find(p=>p.period===V.filter.pgr)?V.filter.pgr:(ps.find(p=>p.period===today().slice(0,7))||ps[0]).period;const p=ps.find(x=>x.period===per);const s=site();

  if(p.contractors?.length){h+=`<div class="panel"><h3>План по подрядчикам</h3>${tbl(['Организация',['Горная масса','м³'],['Вскрыша','м³'],['Добыча','м³'],['Плечо','км'],['Факт перевезено','т']],p.contractors.map(c=>{const f=sumBy(Object.values(st).filter(x=>x.eq.type==='truck'&&nz(x.eq.owner).includes(nz(c.name).slice(0,8))),x=>x.tons);return `<tr><td>${esc(c.name)}</td><td class="n">${fmt(c.rock,0)}</td><td class="n">${fmt(c.waste,0)}</td><td class="n">${fmt(c.ore,0)}</td><td class="n">${fmt(c.haul_km,1)}</td><td class="n">${f?fmt(f,0):'—'}</td></tr>`;}))}</div>`;}
  if(ep.length){h+=Object.entries(byType).map(([ty,arr])=>`<div class="panel"><h3>${EQT[ty]||'Прочее'}: план на ${plab(per)}<span class="sp"></span><span class="hint">${arr.length} ед. · ${fmt(sumBy(arr,x=>x.m3),0)} м³</span></h3>${tbl(['Борт','Организация',['Объём план','м³'],['Факт','м³'],['%'],['Часы план'],['Факт','ч'],['Рейсы план'],['Факт'],['КТГ'],['КИП'],['Плечо','км']],arr.map(x=>{const f=st[x.eqId];const fm=f?(f.tons/((ty==='truck'||ty==='excavator')?((p.ore_m3||0)>(p.waste_m3||0)?dO:dW):dW)):null;
    return `<tr><td><b class="num">${esc(x.code)}</b></td><td class="wrap" style="min-width:110px">${esc(x.owner||'')}</td><td class="n">${fmt(x.m3,0)}</td><td class="n">${fm?fmt(fm,0):'—'}</td><td>${x.m3&&fm?pctPill(pct(fm,x.m3)):''}</td><td class="n">${fmt(x.hours,0)}</td><td class="n">${f?fmt(f.wh,0):'—'}</td><td class="n">${fmt(x.trips,0)}</td><td class="n">${f&&ty==='truck'?f.trips:'—'}</td><td class="n">${x.ktg!=null?fmt(x.ktg<=1?x.ktg*100:x.ktg,0)+'%':'—'}</td><td class="n">${x.kip!=null?fmt(x.kip<=1?x.kip*100:x.kip,0)+'%':'—'}</td><td class="n">${fmt(x.haul_km,1)}</td></tr>`;}))}</div>`).join('');}

  return h;
}

document.addEventListener('click',async e=>{
  const dmt=e.target.closest('[data-dmtoggle]');if(dmt){V.docModOpen=!V.docModOpen;render();return;}
  const dmo=e.target.closest('[data-docmod]');if(dmo){V.docMod=dmo.dataset.docmod;V.docModOpen=false;render();return;}
  const g=e.target.closest('[data-dxgo]');if(g){const [m,t]=g.dataset.dxgo.split(':');V.mod=m;V.tab[m]=t;V.dx=null;render();window.scrollTo({top:0});return;}
  const b=e.target.closest('[data-dxact],[data-dxn]');if(!b)return;
  if(b.dataset.dxn){V.dx.R.target.n=+b.dataset.dxn;render();return;}
  const a=b.dataset.dxact;
  if(a==='cancel'){dxCtl?.abort();return;}
  if(a==='reset'){V.dx=null;dxFile=null;render();return;}
  if(a==='retry'&&dxFile){runDoc(dxFile);return;}
  if(a.startsWith('all:')){const k=a.slice(4);const on=!V.dx.R[k].every(x=>x.on);V.dx.R[k].forEach(x=>x.on=on);render();return;}
  if(a==='apply'){b.disabled=true;try{await applyDoc();toast('Документ внесён в платформу');}catch(err){console.error(err);toast(errMsg(err));b.disabled=false;b.textContent='Внести в платформу';}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dx_file'&&el.files[0]){runDoc(el.files[0]);return;}
  if(el.dataset.dxdate!==undefined&&el.value){V.dx.R.target.date=el.value;render();return;}
  if(el.dataset.dx){const [sec,i,k]=el.dataset.dx.split(':');const x=V.dx.R[sec][+i];if(!x)return;
    if(k==='on')x.on=el.checked;else if(k==='dens_ore'||k==='dens_waste'){const v=parseNum(el.value);if(v>0)x[k]=v;}
    else{x[k]=el.value||null;if(sec==='trips'||sec==='sums'){if(k==='truck'&&!x.exc){const t=byId('equipment',x.truck);if(t?.assignedExc)x.exc=t.assignedExc;}if(k==='from'&&!x.mat){const fa=byId('areas',x.from);if(fa?.type==='face')x.mat=fa.ore?'ore':'waste';}}}

});

/* =================== events =================== */
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-close]')){$('#dlg').close();return;}
  const svg=e.target.closest('#pitsvg');
  if(svg&&V.placing){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());const pl=V.placing;V.placing=null;await safe(()=>patch(pl.c,pl.id,{x:Math.round(p.x),y:Math.round(p.y)}),'Позиция обновлена');render();return;}
  const t=e.target.closest('[data-mod],[data-tab],[data-sh],[data-per],[data-fil],[data-act],[data-eq],[data-area],[data-site]');if(!t)return;
  const d=t.dataset;
  if(d.mod){V.mod=d.mod;V.placing=null;render();window.scrollTo({top:0});return;}
  if(d.tab){const [m,k]=d.tab.split(':');V.tab[m]=k;render();return;}
  if(d.sh){V.n=+d.sh;render();return;}
  if(d.per){V.per=d.per==='m'?'m':+d.per;render();return;}
  if(d.fil){const [k,v]=d.fil.split(':');V.filter[k]=v;render();return;}
  if(d.site){V.sel=d.site;V.mod='bi';render();return;}
  if(d.eq&&!d.act){V.mapSel=d.eq;render();return;}
  if(d.area&&!d.act){if(canEdit())ACT['area-edit'](d.area);return;}
  if(d.act&&ACT[d.act]){try{await ACT[d.act](d.id);}catch(err){console.error(err);toast(errMsg(err));}}
});
document.addEventListener('change',async e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='siteSel'){V.sel=el.value;V.mod='bi';V.mapSel=null;render();return;}
  if(el.id==='sb_date'&&el.value){V.date=el.value;render();return;}
  if(d.assign!==undefined){await safe(()=>patch('equipment',d.assign,{assignedExc:el.value||null}),'Закрепление изменено');return;}
  if(d.task){await safe(()=>updShift(V.date,V.n,s=>{const x=s.tasks.find(t=>t.id===d.task);if(x)x.done=el.checked;}));return;}
});

function uiApply(){let st=document.getElementById('ui-cfg');if(!st){st=document.createElement('style');st.id='ui-cfg';document.body.appendChild(st);}st.textContent=uiCSS(UI);
  const r=document.documentElement;if(UI.theme==='system')delete r.dataset.theme;else r.dataset.theme=UI.theme;}
function uiPanelHTML(){
  const rng=(k,l,min,max,step,u)=>`<label class="uip-f" for="ui_${k}"><span>${l}<b id="uiv_${k}">${UI[k]}${u}</b></span><input type="range" id="ui_${k}" data-ui="${k}" data-u="${u}" min="${min}" max="${max}" step="${step}" value="${UI[k]}"></label>`;
  const seg=(k,l,opts)=>`<div class="uip-f"><span>${l}</span><div class="seg" role="group">${opts.map(([v,t])=>`<button type="button" data-uiseg="${k}:${v}" class="${String(UI[k])===v?'on':''}">${t}</button>`).join('')}</div></div>`;
  const col=(k,l,def)=>`<label class="uip-f uip-row" for="ui_${k}"><span>${l}</span><span class="row"><input type="color" id="ui_${k}" data-uicol="${k}" value="${UI[k]||def}">${UI[k]?`<button type="button" class="btn sm ghost" data-uiclr="${k}">как было</button>`:''}</span></label>`;
  const mods=orderedMods();
  return `<div class="uip-head"><h3>Внешний вид</h3><button type="button" class="btn sm ghost" data-uiclose aria-label="Закрыть">✕</button></div>
  <div class="uip-body">
    <p class="uip-sec">Цвета и тема</p>
    ${seg('theme','Тема',[['system','Как в системе'],['light','Светлая'],['dark','Тёмная']])}
    ${col('accent','Акцентный цвет','#1F4E8C')}${col('series','Цвет графиков','#6F96BC')}
    <p class="uip-sec">Размеры</p>
    ${rng('font','Размер текста',12,18,.5,' px')}${rng('radius','Скругление углов',0,20,1,' px')}
    ${seg('btn','Размер кнопок',[['sm','Мелкие'],['md','Обычные'],['lg','Крупные']])}
    ${rng('dens','Отступы',.6,1.6,.1,'×')}${rng('kpi','Ширина карточек KPI',130,320,5,' px')}${rng('maxw','Ширина страницы',1000,1900,20,' px')}
    <p class="uip-sec">Меню модулей</p>
    ${seg('side','Расположение',[['left','Слева'],['right','Справа'],['top','Сверху']])}
    ${rng('sidew','Ширина меню',180,360,5,' px')}
    <p class="hint" style="margin:6px 0 4px">Порядок, видимость и названия пунктов:</p>
    <div class="uip-mods">${mods.map(([k,no,l],i)=>`<div class="uip-mod"><input type="checkbox" data-uihide="${k}" ${UI.hidden.includes(k)?'':'checked'} aria-label="Показывать"><input type="text" data-uiname="${k}" value="${esc(l)}" aria-label="Название"><button type="button" class="btn sm" data-uimv="${k}:-1" ${i?'':'disabled'} aria-label="Выше">↑</button><button type="button" class="btn sm" data-uimv="${k}:1" ${i<mods.length-1?'':'disabled'} aria-label="Ниже">↓</button></div>`).join('')}</div>
    <p class="uip-sec">Поделиться настройками</p>
    <p class="hint" style="margin:0 0 6px">Настройки сохраняются только в этом браузере. Скопируйте код и отправьте другу, он вставит его у себя.</p>
    <div class="row"><button type="button" class="btn sm" data-uicopy>Скопировать код</button><button type="button" class="btn sm" data-uipaste>Вставить код</button><button type="button" class="btn sm ghost danger" data-uireset>Сбросить всё</button></div>
    <div id="uip_io" hidden><textarea id="uip_txt" rows="4" aria-label="Код настроек"></textarea><button type="button" class="btn sm pri" data-uiload>Применить код</button></div>
  </div>`;
}
function uiPanelOpen(open){const p=$('#uipanel');if(open){p.innerHTML=uiPanelHTML();p.hidden=false;}else p.hidden=true;}
function uiChanged(redrawPanel){uiSave();uiApply();render();if(redrawPanel&&!$('#uipanel').hidden){const y=$('#uipanel .uip-body')?.scrollTop||0;uiPanelOpen(true);const b=$('#uipanel .uip-body');if(b)b.scrollTop=y;}}
(function uiInit(){
  const css=document.createElement('style');css.textContent=`
#uibtn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#uipanel{position:fixed;top:0;right:0;bottom:0;width:min(370px,100vw);z-index:16;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#uipanel[hidden]{display:none!important}
.uip-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.uip-head h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0}
.uip-body{overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:10px}
.uip-sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 0}
.uip-f{display:flex;flex-direction:column;gap:5px;font-size:13px}
.uip-f>span:first-child{display:flex;justify-content:space-between;gap:8px}
.uip-f b{font-family:var(--f-mono);font-weight:600;font-size:12px}
.uip-row{flex-direction:row;align-items:center;justify-content:space-between}
.uip-f input[type=range]{width:100%;accent-color:var(--accent)}
.uip-f input[type=color]{width:42px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--bg);cursor:pointer}
.uip-f .seg{align-self:flex-start}
.uip-mods{display:flex;flex-direction:column;gap:4px}
.uip-mod{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center}
.uip-mod input[type=text]{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:13px}
#uip_io{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#uip_txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;font-family:var(--f-mono);font-size:11.5px;resize:vertical}`;
  document.head.appendChild(css);
  const btn=document.createElement('button');btn.id='uibtn';btn.className='btn pri';btn.type='button';btn.textContent='⚙ Вид';btn.onclick=()=>uiPanelOpen($('#uipanel').hidden);document.body.appendChild(btn);
  const p=document.createElement('aside');p.id='uipanel';p.hidden=true;p.setAttribute('aria-label','Настройки внешнего вида');document.body.appendChild(p);
  p.addEventListener('input',e=>{const el=e.target,d=el.dataset;
    if(d.ui){UI[d.ui]=+el.value;$('#uiv_'+d.ui).textContent=el.value+d.u;uiSave();uiApply();return;}
    if(d.uicol){UI[d.uicol]=el.value;uiSave();uiApply();return;}
    if(d.uiname!==undefined){const k=d.uiname,v=el.value.trim();if(v&&v!==MODS.find(m=>m[0]===k)[2])UI.names[k]=v;else delete UI.names[k];uiSave();renderSide();}});
  p.addEventListener('change',e=>{const d=e.target.dataset;
    if(d.uicol){uiChanged(true);return;}
    if(d.ui){render();return;}
    if(d.uihide){const k=d.uihide;UI.hidden=UI.hidden.filter(x=>x!==k);if(!e.target.checked)UI.hidden.push(k);uiChanged(false);}});
  p.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.uiclose!==undefined){uiPanelOpen(false);return;}
    if(d.uiseg){const [k,v]=d.uiseg.split(':');UI[k]=v;uiChanged(true);return;}
    if(d.uiclr){UI[d.uiclr]=null;uiChanged(true);return;}
    if(d.uimv){const [k,s]=d.uimv.split(':');const ord=orderedMods().map(m=>m[0]);const i=ord.indexOf(k),j=i+(+s);if(j<0||j>=ord.length)return;[ord[i],ord[j]]=[ord[j],ord[i]];UI.order=ord;uiChanged(true);return;}
    if(d.uireset!==undefined){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Точно сбросить?';return;}UI={...UI_DEF,hidden:[],names:{}};uiChanged(true);toast('Настройки сброшены');return;}
    if(d.uicopy!==undefined){const code=JSON.stringify(UI);$('#uip_io').hidden=false;$('#uip_txt').value=code;try{await navigator.clipboard.writeText(code);toast('Код настроек скопирован');}catch(err){$('#uip_txt').select();toast('Выделите код и скопируйте вручную');}return;}
    if(d.uipaste!==undefined){$('#uip_io').hidden=false;$('#uip_txt').value='';$('#uip_txt').focus();return;}
    if(d.uiload!==undefined){try{const o=JSON.parse($('#uip_txt').value);if(!o||typeof o!=='object')throw 0;UI={...UI_DEF,...o,hidden:Array.isArray(o.hidden)?o.hidden:[],names:o.names&&typeof o.names==='object'?o.names:{}};uiChanged(true);toast('Настройки применены');}catch(err){toast('Код не распознан. Скопируйте его целиком.');}}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#uipanel').hidden&&!$('#dlg').open)uiPanelOpen(false);});
  uiApply();
})();
